<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seiva 2026 – prototype</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1ea;--card:#fff;--ink:#1d2b22;--mut:#5d6b62;--green:#2f7d4f;--soft:#e3f0e7;--warn:#b4531a;--warnbg:#fdeee2;--line:#d9ddd5;--ai:#e8eefc;--aiink:#2b4a9a;--hu:#fff1d6;--huink:#8a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1c2620;--ink:#eaf1ec;--mut:#9fb0a5;--green:#5fc28a;--soft:#22382b;--warn:#f0a070;--warnbg:#3a2a1f;--line:#2f3d34;--ai:#202c4a;--aiink:#a9c0ff;--hu:#3d3218;--huink:#f0cd7a}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:420px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0}.sub{color:var(--mut);font-size:13px;margin:2px 0 12px}
.dots{display:flex;gap:6px;margin:0 0 12px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--green)}
.phone{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:300px}
.bar{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:10px}
.plant{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pic{width:56px;height:56px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:30px}
.pic.bad{background:var(--warnbg)}
.msg{border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}
.ai{background:var(--ai);color:var(--aiink)}.me{background:var(--soft);margin-left:36px}
.warn{background:var(--warnbg);color:var(--warn)}
.btn{font:inherit;border:1px solid var(--green);background:var(--card);color:var(--green);border-radius:12px;padding:9px 12px;margin:4px 4px 0 0;cursor:pointer;font-size:14px}
.btn.fill{background:var(--green);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.meter{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}.meter b{display:block;height:100%;background:var(--warn)}
.conf{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.conf b{display:block;height:100%;background:var(--green)}
label.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.note{margin-top:12px;display:grid;gap:8px}
.tag{border-radius:12px;padding:8px 10px;font-size:13px}
.tag b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.t-core{background:var(--soft)}.t-ai{background:var(--ai);color:var(--aiink)}.t-hu{background:var(--hu);color:var(--huink)}.t-lim{background:var(--warnbg);color:var(--warn)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.foot{font-size:12px;color:var(--mut);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌿 Seiva · 2026 prototype</h1>
  <p class="sub">Marina’s journey with today’s AI. Screens are real; AI answers are simulated.</p>
  <div class="dots" id="dots"></div>
  <div class="phone" id="screen"></div>
  <div class="note" id="note"></div>
  <div class="nav">
    <button class="btn" id="back">← Back</button>
    <button class="btn fill" id="next">Next →</button>
  </div>
  <p class="foot">Prototype for DSG1957 · G1. The sensor readings and the AI replies are fictional examples (Wizard of Oz).</p>
</div>
<script>
var step=0, S={};
function t(k){return !!S[k]}
function set(k,v){S[k]=(v===undefined?true:v);draw()}
function chk(k,items){var h='';items.forEach(function(x,i){h+='<label class="chk"><input type="checkbox" '+(S[k+i]?'checked':'')+' onchange="S[\''+k+i+'\']=this.checked;draw()"> '+x+'</label>'});var n=items.filter(function(_,i){return S[k+i]}).length;return h+'<p><small>'+n+' of '+items.length+' done by you</small></p>'}
var steps=[
 {title:"1 · Choose the plant",core:"Give the plant what it needs (the right plant)",ai:"Estimates sun hours from the balcony photo, reads local climate and suggests heat-tolerant plants with their adult size.",hu:"Marina chooses a plant, then buys and carries it herself.",lim:"AI can’t inspect a real plant in a shop or pay for it. The person decides and buys.",
  view:function(){var h='<div class="bar"><span>Seiva</span><span>Find a plant</span></div><div class="plant"><div class="pic">🏙️</div><div><b>Balcony photo sent</b><br><small>About 6 h of sun · Rio de Janeiro</small></div></div><div class="msg ai">Good for heat: <b>ipê-amarelo</b> (adult 8 m), <b>pitangueira</b> (3 m), <b>alecrim</b> (1 m).</div>';
   ['ipê-amarelo','pitangueira','alecrim'].forEach(function(n){h+='<button class="btn'+(S.plant===n?' fill':'')+'" onclick="set(\'plant\',\''+n+'\')">'+n+'</button>'});
   if(S.plant)h+='<div class="msg warn">Your choice: '+S.plant+'. Buy it at a nursery. I can’t see how healthy it is in the shop, so check it yourself.</div>';return h}},
 {title:"2 · Choose the setup",core:"Give the plant what it needs (the right setup)",ai:"Suggests a pot size and a sensor kit from the plant’s adult size, and prefers a modular one.",hu:"Marina compares, buys and pays. Kits come in fixed sizes.",lim:"AI can’t confirm that parts fit perfectly, and it can’t buy for her.",
  view:function(){var h='<div class="bar"><span>Seiva</span><span>Setup for ipê</span></div><div class="msg ai">For the first year: pot <b>40 L</b>, and a sensor kit with an <b>extendable probe</b> (30–80 cm). Choose modular parts so you can resize later.</div><div class="plant"><div class="pic">🪴</div><div>Pot 40 L + extendable probe<br><small>Fixed sizes, so growth needs new parts</small></div></div>';
   h+=t('bought')?'<div class="msg me">I bought both. Delivery in 3 days.</div>':'<button class="btn fill" onclick="set(\'bought\')">I bought them myself</button>';return h}},
 {title:"3 · Place plant and setup",core:"Give the plant what it needs (the right place)",ai:"Checks a photo of the installation and registers the plant.",hu:"Marina carries, plants, positions and installs everything by hand.",lim:"AI can’t touch anything. A sensor placed wrongly gives false data.",
  view:function(){var h='<div class="bar"><span>Seiva</span><span>Installation</span></div>'+chk('p',['Plant the ipê in the 40 L pot','Put the pot in the sunny corner','Push the sensor 15 cm into the soil']);
   if(S.p0&&S.p1&&S.p2){h+=t('pc')?'<div class="msg ai">Photo checked: the sensor is deep enough. Registered as <b>ipê-amarelo</b> (82% sure). First reading: soil 48%.</div>':'<button class="btn fill" onclick="set(\'pc\')">📷 Send photo</button>'}return h}},
 {title:"4 · Heat wave alert",core:"Warn about climate threats ahead",ai:"Combines the sensor reading with the public forecast and writes an alert.",hu:"Marina reads it and decides when to act.",lim:"The forecast can be off. The alert never triggers anything by itself.",
  view:function(){return '<div class="bar"><span>Seiva</span><span>Today</span></div><div class="msg warn"><b>⚠️ Heat wave on Thursday: 38°C</b><br>Soil moisture is 22%.</div><div class="meter"><b style="width:22%"></b></div><div class="msg ai">Water early Wednesday and Thursday. Check the soil with your finger first.</div>'}},
 {title:"5 · Yellow spots",core:"Notice trouble · Work out what is wrong",ai:"Analyzes the photo, asks questions and ranks likely causes with a confidence level.",hu:"Marina takes the photo and answers honestly.",lim:"Sunburn, fungus and lack of nutrients look alike in photos.",
  view:function(){var h='<div class="bar"><span>Seiva</span><span>Scan leaf</span></div><div class="plant"><div class="pic bad">🍂</div><div>Yellow spots on the lower leaves</div></div>';
   if(!t('ph'))return h+'<button class="btn fill" onclick="set(\'ph\')">📷 Send photo</button>';
   h+='<div class="msg ai">Possible <b>sunburn</b> or <b>fungal spot</b>. Confidence 58%.</div><div class="conf"><b style="width:58%"></b></div><div class="msg ai">Are the spots only on leaves that get afternoon sun?</div>';
   return h+(t('as')?'<div class="msg me">Yes, only the sunny side.</div><div class="msg ai"><b>Sunburn 74%</b> · fungus 18%.</div>':'<button class="btn" onclick="set(\'as\')">Yes, only the sunny side</button><button class="btn" onclick="set(\'as\')">No, everywhere</button>')}},
 {title:"6 · Care plan",core:"Give the plant what it needs (water and shade)",ai:"Recommends how much, when and where. It can’t water or move anything.",hu:"Marina does all the physical care herself.",lim:"AI can’t feel the soil, so it may over- or under-water. She checks first.",
  view:function(){return '<div class="bar"><span>Seiva</span><span>Plan for Thursday</span></div><div class="msg ai">Here is what I recommend. You do it, then tick it off.</div>'+chk('c',['Move the pot to partial shade','Water 500 ml before 8 am','Don’t fertilize during the heat wave'])}},
 {title:"7 · Ask an expert",core:"Bring in an expert when unsure",ai:"Notices the 18% chance of fungus and prepares a case summary with photos and readings.",hu:"Marina decides whether to send it to a nursery or agronomist.",lim:"The AI may fail to escalate a serious case, so she can always ask for help herself.",
  view:function(){return '<div class="bar"><span>Seiva</span><span>Case summary</span></div><div class="msg ai"><b>Case #1 · Ipê-amarelo</b><br>Spots on sunny side<br>Soil 22% → 48% after watering<br>Sunburn 74% · fungus 18%<br>📎 3 photos</div>'+(t('sent')?'<div class="msg me">Sent to the nursery. A person will answer.</div>':'<button class="btn fill" onclick="set(\'sent\')">Send to a nursery</button><button class="btn">Not now</button>')}},
 {title:"8 · The plant outgrows its setup",core:"Give the plant what it needs (a setup that fits as it grows)",ai:"Compares the photo timeline with the species’ growth curve and warns that the pot and probe are too small, and suggests the next size.",hu:"Marina buys a bigger pot and probe, repots and re-installs the sensor.",lim:"The setup is a physical object. Unlike the 2050 capsule, it can’t resize itself. A growth check every few months is part of the service.",
  view:function(){return '<div class="bar"><span>Seiva</span><span>Growth check · month 8</span></div><div class="msg warn"><b>Pot is nearly full of roots</b><br>The plant grew 70 cm. The 40 L pot and the 30–80 cm probe are too small.</div><small>Pot capacity used</small><div class="meter"><b style="width:92%"></b></div><div class="msg ai">Next size: pot <b>80 L</b>, probe extended to <b>60 cm</b>. Modular parts mean you only buy the pot and an extension.</div>'+chk('g',['Buy the 80 L pot and probe extension','Repot the ipê','Re-install the sensor at 25 cm'])}},
 {title:"9 · Remember what happened",core:"Remember the plant’s history",ai:"Summarizes the timeline and which actions helped. It never invents entries.",hu:"Marina records the outcome and can edit or delete anything.",lim:"A summary can mix up events, so every entry is editable.",
  view:function(){return '<div class="bar"><span>Seiva</span><span>Timeline</span></div><div class="msg ai">Summary: heat wave 38°C, you watered twice and moved the pot to shade. No new spots. At month 8 you moved to an 80 L pot.</div><div class="plant"><div class="pic">🌳</div><div><b>Ipê is recovering</b></div></div>'+(t('lg')?'<div class="msg me">Saved to the timeline ✔</div>':'<button class="btn fill" onclick="set(\'lg\')">Log: “recovered”</button>')}}
];
function draw(){
  var s=steps[step];
  document.getElementById('dots').innerHTML=steps.map(function(_,i){return '<i class="'+(i<=step?'on':'')+'"></i>'}).join('');
  document.getElementById('screen').innerHTML=s.view();
  document.getElementById('note').innerHTML=
   '<div class="tag t-core"><b>Core function</b>'+s.core+'</div>'+
   '<div class="tag t-ai"><b>🤖 What the AI does</b>'+s.ai+'</div>'+
   '<div class="tag t-hu"><b>🧑 What the person does</b>'+s.hu+'</div>'+
   '<div class="tag t-lim"><b>Limit</b>'+s.lim+'</div>';
  document.getElementById('back').disabled=step===0;
  var n=document.getElementById('next');n.textContent=step===steps.length-1?'Restart ↺':'Next →';
}
document.getElementById('next').onclick=function(){step=(step+1)%steps.length;draw();window.scrollTo(0,0)};
document.getElementById('back').onclick=function(){if(step>0){step--;draw()}};
draw();
</script>
</body>
</html>
